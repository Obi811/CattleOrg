version: 2

# Automatische Abhaengigkeits-Aktualisierungen (woechentlich).
# - github-actions: haelt die in Workflows genutzten Actions aktuell.
# - composer: nur aktiv, weil eine composer.json im Repo-Root vorhanden ist
#   (dompdf, phpspreadsheet). Updates betreffen NUR die Composer-Lock/Manifest,
#   es wird kein Composer in die App eingebaut.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "abhaengigkeiten"
      - "ci"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "abhaengigkeiten"
      - "php"
    commit-message:
      prefix: "deps"
      include: "scope"
